name: Windows Test Build
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
permissions:
  contents: read
jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Tag version for CMake
        run: git tag 33.0.1-fork

      - name: Build OBS Studio
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo

      - name: Package OBS Studio
        uses: ./.github/actions/package-obs
        with:
          target: x64
          config: RelWithDebInfo
          package: false

      - name: Upload portable build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obs-studio-windows-x64-${{ github.sha }}
          retention-days: 7
          path: ${{ github.workspace }}/build_x64/obs-studio-*-windows-x64.zip
